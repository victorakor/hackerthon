<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Go Hackathon — 5hr Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#080c10; --surface:#0d1520; --card:#111b28; --border:#1e3048;
  --accent:#00d4ff; --accent2:#00ff9d; --accent3:#ff6b35; --warn:#ffcc00;
  --text:#c8daea; --muted:#4a6b8a;
  --easy:#00ff9d; --medium:#ffcc00; --hard:#ff4d6d;
  --font-mono:'JetBrains Mono',monospace; --font-ui:'Space Grotesk',sans-serif;
  --glow:0 0 20px rgba(0,212,255,0.15); --glow-green:0 0 20px rgba(0,255,157,0.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 24px}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--bg);flex-shrink:0}
.brand-name{font-family:var(--font-mono);font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.5px}
.brand-name span{color:var(--accent)}
.brand-sub{font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.timer-block{display:flex;flex-direction:column;align-items:center;gap:4px}
.timer-label{font-family:var(--font-mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.timer-display{font-family:var(--font-mono);font-size:32px;font-weight:700;letter-spacing:4px;color:var(--accent2);text-shadow:0 0 20px rgba(0,255,157,0.4);transition:color .3s,text-shadow .3s}
.timer-display.warning{color:var(--warn);text-shadow:0 0 20px rgba(255,204,0,0.4)}
.timer-display.critical{color:var(--hard);text-shadow:0 0 20px rgba(255,77,109,0.5);animation:pulse-timer 1s infinite}
@keyframes pulse-timer{0%,100%{opacity:1}50%{opacity:.6}}
.timer-controls{display:flex;gap:6px;margin-top:2px}
.timer-btn{padding:3px 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--font-mono);font-size:10px;cursor:pointer;transition:all .2s}
.timer-btn:hover{border-color:var(--accent);color:var(--accent)}

/* NAV TABS */
.nav-tabs{display:flex;gap:4px;padding:16px 0 0;border-bottom:1px solid var(--border)}
.nav-tab{padding:8px 20px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;font-family:var(--font-mono);font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;transition:all .2s;letter-spacing:1px;text-transform:uppercase;position:relative;bottom:-1px}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{border-color:var(--border);border-bottom-color:var(--bg);background:var(--bg);color:var(--accent)}

/* PROGRESS */
.progress-section{padding:16px 0;border-bottom:1px solid var(--border)}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-label{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.progress-count{font-family:var(--font-mono);font-size:13px;color:var(--accent)}
.progress-bar-outer{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(0,212,255,0.4)}
.stats-row{display:flex;gap:20px;margin-top:10px}
.stat-pill{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* LAYOUT */
.main-layout{display:grid;grid-template-columns:300px 1fr;gap:24px;padding:24px 0;min-height:calc(100vh - 260px)}
.sidebar{display:flex;flex-direction:column;gap:12px}
.sidebar-title{font-family:var(--font-mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-mono);font-size:10px;cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-chip:hover,.filter-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,0.05)}
.question-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:calc(100vh - 380px);padding-right:4px}
.question-list::-webkit-scrollbar{width:4px}
.question-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.q-item{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:10px}
.q-item:hover{border-color:var(--accent);background:rgba(0,212,255,0.04)}
.q-item.active{border-color:var(--accent);background:rgba(0,212,255,0.08);box-shadow:var(--glow)}
.q-item.completed .q-num{background:var(--accent2);color:var(--bg)}
.q-num{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--bg);background:var(--muted);border-radius:4px;padding:2px 5px;flex-shrink:0;min-width:24px;text-align:center;transition:background .2s}
.q-item.active .q-num{background:var(--accent)}
.q-info{flex:1;min-width:0}
.q-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.q-meta{display:flex;gap:6px;margin-top:4px;align-items:center}
.diff-badge{font-family:var(--font-mono);font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.diff-easy{background:rgba(0,255,157,0.1);color:var(--easy)}
.diff-medium{background:rgba(255,204,0,0.1);color:var(--medium)}
.diff-hard{background:rgba(255,77,109,0.1);color:var(--hard)}
.cat-tag{font-family:var(--font-mono);font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* DETAIL PANE */
.detail-pane{display:flex;flex-direction:column;gap:20px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:400px;gap:16px;opacity:.4}
.empty-state-icon{font-size:48px;font-family:var(--font-mono);color:var(--muted)}
.empty-state-text{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:center}
.detail-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:slide-in .3s ease}
@keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.detail-header{padding:24px 28px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.detail-title-group{flex:1}
.detail-number{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.detail-title{font-size:22px;font-weight:700;color:#fff;line-height:1.2;letter-spacing:-.5px}
.detail-badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{font-family:var(--font-mono);font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.badge-easy{border-color:var(--easy);color:var(--easy)}
.badge-medium{border-color:var(--medium);color:var(--medium)}
.badge-hard{border-color:var(--hard);color:var(--hard)}
.badge-cat{border-color:var(--border);color:var(--muted)}
.detail-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:1px solid;font-family:var(--font-mono);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-complete{border-color:var(--accent2);color:var(--accent2);background:rgba(0,255,157,0.05)}
.btn-complete:hover{background:rgba(0,255,157,0.15);box-shadow:var(--glow-green)}
.btn-complete.done{background:rgba(0,255,157,0.2)}
.btn-submit-sol{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,0.05)}
.btn-submit-sol:hover{background:rgba(0,212,255,0.15)}
.btn-view-sol{border-color:var(--border);color:var(--muted);background:transparent}
.btn-view-sol:hover{border-color:var(--text);color:var(--text)}
.btn-delete{border-color:var(--border);color:var(--muted);background:transparent}
.btn-delete:hover{border-color:var(--hard);color:var(--hard)}
.detail-body{padding:28px}
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.description-text{font-size:15px;line-height:1.75;color:var(--text)}
.description-text code{font-family:var(--font-mono);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--accent)}
.hint-card{margin-top:24px;padding:16px 20px;background:rgba(0,212,255,0.04);border:1px solid rgba(0,212,255,0.2);border-radius:8px;display:flex;align-items:center;gap:12px}
.hint-icon{font-size:18px;flex-shrink:0}
.hint-content{flex:1}
.hint-label{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.hint-link{font-family:var(--font-mono);font-size:13px;color:var(--accent);text-decoration:none;transition:color .2s}
.hint-link:hover{color:var(--accent2);text-decoration:underline}

/* INLINE TABS (question detail) */
.inline-tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--border)}
.inline-tab{padding:6px 16px;font-family:var(--font-mono);font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;transition:all .2s;text-transform:uppercase;letter-spacing:1px;position:relative;bottom:-1px}
.inline-tab:hover{color:var(--text)}
.inline-tab.active{border-color:var(--border);border-bottom-color:var(--card);background:var(--card);color:var(--accent)}
.inline-tab-content{padding:20px 0 0;display:none}
.inline-tab-content.active{display:block}

/* SUBMIT FORM */
.submit-form{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.form-input,.form-select,.form-textarea{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font-ui);font-size:13px;transition:border-color .2s,box-shadow .2s;outline:none;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,212,255,0.1)}
.form-select option{background:var(--surface)}
.code-textarea{font-family:var(--font-mono);font-size:12px;line-height:1.6;resize:vertical;min-height:180px;tab-size:2}
.form-textarea{resize:vertical;min-height:80px}
.form-actions{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
.btn-primary{padding:10px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:var(--bg);font-family:var(--font-mono);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px;text-transform:uppercase}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,212,255,0.3)}
.btn-ghost{padding:10px 20px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:var(--font-mono);font-size:12px;cursor:pointer;transition:all .2s}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}

/* SUBMISSIONS LIST */
.submissions-list{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.sub-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s}
.sub-card:hover{border-color:var(--accent)}
.sub-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.sub-author{font-family:var(--font-mono);font-size:13px;font-weight:700;color:#fff}
.sub-meta{display:flex;align-items:center;gap:10px}
.sub-lang{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(0,212,255,0.1);color:var(--accent);border:1px solid rgba(0,212,255,0.2)}
.star-display{display:flex;align-items:center;gap:4px}
.stars{font-size:13px;letter-spacing:1px}
.rating-num{font-family:var(--font-mono);font-size:12px;color:var(--warn)}
.review-count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.rank-badge{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0}
.rank-1{background:rgba(255,204,0,0.15);color:var(--warn);border:1px solid rgba(255,204,0,0.3)}
.rank-2{background:rgba(192,192,192,0.1);color:#c0c0c0;border:1px solid rgba(192,192,192,0.3)}
.rank-3{background:rgba(205,127,50,0.1);color:#cd7f32;border:1px solid rgba(205,127,50,0.3)}
.sub-body{padding:0 18px 18px;display:none}
.sub-body.open{display:block}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto;margin-bottom:14px}
.code-block pre{font-family:var(--font-mono);font-size:12px;line-height:1.7;color:#a8d8ea;white-space:pre-wrap;word-break:break-word}
.sub-notes{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;font-style:italic}
.sub-date{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:16px}

/* REVIEWS */
.reviews-section{border-top:1px solid var(--border);padding-top:16px}
.reviews-title{font-family:var(--font-mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.review-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.reviewer-name{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text)}
.review-stars{font-size:12px}
.review-comment{font-size:13px;color:var(--muted);line-height:1.5}
.review-date{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:4px}
.add-review{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px}
.add-review-title{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.star-picker{display:flex;gap:6px;margin-bottom:12px}
.star-btn{font-size:20px;background:none;border:none;cursor:pointer;color:var(--border);transition:color .15s;padding:0}
.star-btn.active,.star-btn:hover{color:var(--warn)}
.no-submissions{text-align:center;padding:40px 20px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}

/* ADD QUESTION PANEL */
.add-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.panel-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;transition:background .2s}
.panel-header:hover{background:rgba(0,212,255,0.03)}
.panel-title{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.panel-toggle{font-family:var(--font-mono);font-size:14px;color:var(--muted);transition:transform .3s}
.panel-toggle.open{transform:rotate(45deg)}
.panel-body{padding:24px;display:none}
.panel-body.open{display:block}

/* LEADERBOARD */
.leaderboard-page{padding:24px 0}
.lb-header{margin-bottom:24px}
.lb-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px}
.lb-sub{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:4px}
.lb-table{width:100%;border-collapse:collapse}
.lb-table th{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:10px 16px;text-align:left;border-bottom:1px solid var(--border)}
.lb-table td{padding:14px 16px;border-bottom:1px solid rgba(30,48,72,0.5);font-size:14px}
.lb-table tr:hover td{background:rgba(0,212,255,0.03)}
.lb-rank{font-family:var(--font-mono);font-weight:700;font-size:16px}
.lb-name{font-weight:600;color:#fff}
.lb-subs{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.lb-rating{font-family:var(--font-mono);font-size:14px;color:var(--warn);font-weight:700}
.lb-reviews{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.lb-bar-cell{width:200px}
.lb-bar-outer{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.lb-bar-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px}
.empty-lb{text-align:center;padding:60px 20px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-family:var(--font-mono);font-size:12px;font-weight:600;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);border:1px solid;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{background:rgba(0,255,157,0.1);border-color:var(--accent2);color:var(--accent2)}
#toast.error{background:rgba(255,77,109,0.1);border-color:var(--hard);color:var(--hard)}

/* LOADING */
.loading{text-align:center;padding:40px;font-family:var(--font-mono);font-size:12px;color:var(--muted);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:900px){
  .main-layout{grid-template-columns:1fr}
  .question-list{max-height:240px}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header>
  <div class="brand">
    <div class="brand-logo">Go</div>
    <div>
      <div class="brand-name">hack<span>.go</span></div>
      <div class="brand-sub">Bootcamp Challenge</div>
    </div>
  </div>
  <div class="timer-block">
    <div class="timer-label">⏱ Time Remaining</div>
    <div class="timer-display" id="timerDisplay">05:00:00</div>
    <div class="timer-controls">
      <button class="timer-btn" id="timerToggle" onclick="toggleTimer()">PAUSE</button>
      <button class="timer-btn" onclick="resetTimer()">RESET</button>
    </div>
  </div>
</header>

<!-- NAV TABS -->
<div class="nav-tabs">
  <button class="nav-tab active" onclick="switchPage('questions',this)">Questions</button>
  <button class="nav-tab" onclick="switchPage('leaderboard',this)">🏆 Leaderboard</button>
</div>

<!-- PROGRESS -->
<div class="progress-section" id="progressSection">
  <div class="progress-meta">
    <div class="progress-label">Challenge Progress</div>
    <div class="progress-count" id="progressCount">0 / 0 completed</div>
  </div>
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width:0%"></div></div>
  <div class="stats-row" id="statsRow"></div>
</div>

<!-- QUESTIONS PAGE -->
<div id="questionsPage">
<div class="main-layout">
  <aside class="sidebar">
    <div class="sidebar-title">Questions</div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" onclick="setFilter('all',this)">All</button>
      <button class="filter-chip" onclick="setFilter('easy',this)">Easy</button>
      <button class="filter-chip" onclick="setFilter('medium',this)">Medium</button>
      <button class="filter-chip" onclick="setFilter('hard',this)">Hard</button>
    </div>
    <div class="question-list" id="questionList"></div>
  </aside>

  <div class="detail-pane">
    <div id="detailArea">
      <div class="empty-state">
        <div class="empty-state-icon">{ }</div>
        <div class="empty-state-text">← Select a question to begin<br/>Your 5-hour clock is ticking</div>
      </div>
    </div>

    <!-- ADD QUESTION -->
    <div class="add-panel">
      <div class="panel-header" onclick="toggleAddPanel()">
        <div class="panel-title"><span>+</span> Add New Question</div>
        <div class="panel-toggle" id="panelToggle">+</div>
      </div>
      <div class="panel-body" id="panelBody">
        <div class="form-grid">
          <div class="form-group full">
            <label class="form-label">Question Title</label>
            <input class="form-input" id="newTitle" type="text" placeholder="e.g. Reading files with bufio.Scanner"/>
          </div>
          <div class="form-group full">
            <label class="form-label">Description / Task</label>
            <textarea class="form-textarea" id="newDesc" placeholder="Describe what the candidate needs to implement..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Difficulty</label>
            <select class="form-select" id="newDiff">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input class="form-input" id="newCat" type="text" placeholder="e.g. File I/O"/>
          </div>
          <div class="form-group">
            <label class="form-label">Hint Link URL</label>
            <input class="form-input" id="newHintUrl" type="url" placeholder="https://pkg.go.dev/..."/>
          </div>
          <div class="form-group">
            <label class="form-label">Hint Link Text</label>
            <input class="form-input" id="newHintText" type="text" placeholder="e.g. os.ReadFile docs"/>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-ghost" onclick="toggleAddPanel()">Cancel</button>
          <button class="btn-primary" onclick="submitQuestion()">+ Add Question</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<!-- LEADERBOARD PAGE -->
<div id="leaderboardPage" style="display:none">
  <div class="leaderboard-page">
    <div class="lb-header">
      <div class="lb-title">🏆 Contributor Leaderboard</div>
      <div class="lb-sub">Ranked by average peer review rating across all submissions</div>
    </div>
    <div id="lbContent"><div class="loading">Loading leaderboard...</div></div>
  </div>
</div>

</div><!-- .app -->
<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────
let questions = [], completed = new Set(), activeId = null, currentFilter = 'all';
let expandedSubs = new Set(), reviewRatings = {};

try { const s = localStorage.getItem('hackathon_completed'); if(s) completed = new Set(JSON.parse(s)); } catch(e){}

// ── TIMER ──────────────────────────────────────────────────
const DURATION = 5*60*60;
let timeLeft = DURATION, timerRunning = true;
try { const t = parseInt(localStorage.getItem('hackathon_timer')); if(t>0&&t<=DURATION) timeLeft=t; } catch(e){}

function formatTime(s){ return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timeLeft);
  el.className = 'timer-display' + (timeLeft<=600?' critical':timeLeft<=1800?' warning':'');
}
function toggleTimer(){ timerRunning=!timerRunning; document.getElementById('timerToggle').textContent=timerRunning?'PAUSE':'START'; }
function resetTimer(){ timeLeft=DURATION; timerRunning=true; document.getElementById('timerToggle').textContent='PAUSE'; updateTimerDisplay(); try{localStorage.removeItem('hackathon_timer');}catch(e){} }
setInterval(()=>{ if(!timerRunning||timeLeft<=0) return; timeLeft--; updateTimerDisplay(); try{localStorage.setItem('hackathon_timer',timeLeft);}catch(e){}; }, 1000);
updateTimerDisplay();

// ── PAGE SWITCHING ─────────────────────────────────────────
function switchPage(page, el){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('questionsPage').style.display = page==='questions'?'':'none';
  document.getElementById('leaderboardPage').style.display = page==='leaderboard'?'':'none';
  document.getElementById('progressSection').style.display = page==='questions'?'':'none';
  if(page==='leaderboard') loadLeaderboard();
}

// ── QUESTIONS ──────────────────────────────────────────────
async function loadQuestions(){
  try{
    const res = await fetch('/api/questions');
    questions = await res.json();
    renderSidebar(); updateProgress();
  } catch(e){ showToast('Failed to load questions','error'); }
}

function renderSidebar(){
  const filtered = currentFilter==='all' ? questions : questions.filter(q=>q.difficulty===currentFilter);
  document.getElementById('questionList').innerHTML = filtered.map((q,i)=>`
    <div class="q-item ${activeId===q.id?'active':''} ${completed.has(q.id)?'completed':''}" onclick="selectQuestion(${q.id})">
      <div class="q-num">${completed.has(q.id)?'✓':(i+1)}</div>
      <div class="q-info">
        <div class="q-title">${esc(q.title)}</div>
        <div class="q-meta">
          <span class="diff-badge diff-${q.difficulty}">${q.difficulty}</span>
          <span class="cat-tag">${esc(q.category)}</span>
        </div>
      </div>
    </div>`).join('');
}

function selectQuestion(id){
  activeId=id; renderSidebar();
  const q = questions.find(q=>q.id===id); if(!q) return;
  const isDone = completed.has(id);
  const displayNum = questions.findIndex(x=>x.id===id) + 1;
  document.getElementById('detailArea').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-title-group">
          <div class="detail-number">Question #${displayNum}</div>
          <div class="detail-title">${esc(q.title)}</div>
          <div class="detail-badges">
            <span class="badge badge-${q.difficulty}">${q.difficulty}</span>
            <span class="badge badge-cat">${esc(q.category)}</span>
          </div>
        </div>
        <div class="detail-actions">
          <button class="btn btn-complete ${isDone?'done':''}" onclick="toggleComplete(${q.id})">${isDone?'✓ Completed':'◎ Mark Done'}</button>
          <button class="btn btn-delete" onclick="deleteQuestion(${q.id})">✕</button>
        </div>
      </div>
      <div class="detail-body">
        <div class="section-label">Task Description</div>
        <div class="description-text">${fmtDesc(q.description)}</div>
        <div class="hint-card">
          <div class="hint-icon">💡</div>
          <div class="hint-content">
            <div class="hint-label">Hint — Go Docs</div>
            <a class="hint-link" href="${esc(q.hint_url)}" target="_blank" rel="noopener">→ ${esc(q.hint_text||q.hint_url)}</a>
          </div>
        </div>
        <div class="inline-tabs">
          <button class="inline-tab active" onclick="switchInlineTab('task',this,${q.id})">Task</button>
          <button class="inline-tab" onclick="switchInlineTab('submit',this,${q.id})">Submit Solution</button>
          <button class="inline-tab" onclick="switchInlineTab('solutions',this,${q.id})">View Solutions</button>
        </div>
        <div id="tab-task-${q.id}" class="inline-tab-content active"></div>
        <div id="tab-submit-${q.id}" class="inline-tab-content">${renderSubmitForm(q.id)}</div>
        <div id="tab-solutions-${q.id}" class="inline-tab-content"><div class="loading">Loading...</div></div>
      </div>
    </div>`;
}

function switchInlineTab(tab, el, qid){
  const body = el.closest('.detail-body');
  body.querySelectorAll('.inline-tab').forEach(t=>t.classList.remove('active'));
  body.querySelectorAll('.inline-tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`tab-${tab}-${qid}`).classList.add('active');
  if(tab==='solutions') loadSubmissions(qid);
}

// ── SUBMIT SOLUTION ────────────────────────────────────────
function renderSubmitForm(qid){
  return `
  <div class="submit-form">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input class="form-input" id="sol-name-${qid}" type="text" placeholder="e.g. Victor"/>
      </div>
      <div class="form-group">
        <label class="form-label">Language</label>
        <select class="form-select" id="sol-lang-${qid}">
          <option value="go" selected>Go</option>
          <option value="bash">Bash</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group full">
        <label class="form-label">Your Code</label>
        <textarea class="form-input code-textarea" id="sol-code-${qid}" placeholder="package main\n\nimport \"fmt\"\n\nfunc main() {\n    // your solution here\n}"></textarea>
      </div>
      <div class="form-group full">
        <label class="form-label">Notes / Explanation (optional)</label>
        <textarea class="form-textarea" id="sol-notes-${qid}" placeholder="Explain your approach, time complexity, trade-offs..."></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" onclick="submitSolution(${qid})">Submit Solution →</button>
    </div>
  </div>`;
}

async function submitSolution(qid){
  const name  = document.getElementById(`sol-name-${qid}`).value.trim();
  const lang  = document.getElementById(`sol-lang-${qid}`).value;
  const code  = document.getElementById(`sol-code-${qid}`).value.trim();
  const notes = document.getElementById(`sol-notes-${qid}`).value.trim();
  if(!name||!code){ showToast('Name and code are required','error'); return; }
  try{
    const res = await fetch('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question_id:qid,author_name:name,code,language:lang,notes})});
    if(!res.ok) throw new Error();
    document.getElementById(`sol-code-${qid}`).value='';
    document.getElementById(`sol-notes-${qid}`).value='';
    showToast('Solution submitted! 🚀','success');
  } catch(e){ showToast('Failed to submit','error'); }
}

// ── LOAD SUBMISSIONS ───────────────────────────────────────
async function loadSubmissions(qid){
  const el = document.getElementById(`tab-solutions-${qid}`);
  el.innerHTML = '<div class="loading">Loading solutions...</div>';
  try{
    const res = await fetch(`/api/submissions?question_id=${qid}`);
    const subs = await res.json();
    if(!subs.length){ el.innerHTML='<div class="no-submissions">No solutions yet. Be the first to submit!</div>'; return; }
    el.innerHTML = `<div class="submissions-list">${subs.map((s,i)=>renderSubCard(s,i+1)).join('')}</div>`;
  } catch(e){ el.innerHTML='<div class="no-submissions">Failed to load solutions.</div>'; }
}

function renderSubCard(s, rank){
  const stars = renderStars(s.avg_rating);
  const rankBadge = rank<=3 ? `<span class="rank-badge rank-${rank}">${['🥇','🥈','🥉'][rank-1]} #${rank}</span>` : `<span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">#${rank}</span>`;
  const isOpen = expandedSubs.has(s.id);
  return `
  <div class="sub-card" id="sub-${s.id}">
    <div class="sub-header" onclick="toggleSub(${s.id},${s.question_id})">
      <div style="display:flex;align-items:center;gap:10px">
        ${rankBadge}
        <span class="sub-author">${esc(s.author_name)}</span>
        <span class="sub-lang">${esc(s.language)}</span>
      </div>
      <div class="sub-meta">
        <div class="star-display">
          <span class="stars">${stars}</span>
          <span class="rating-num">${s.avg_rating>0?s.avg_rating.toFixed(1):'—'}</span>
        </div>
        <span class="review-count">${s.review_count} review${s.review_count!==1?'s':''}</span>
        <span style="color:var(--muted);font-size:12px">${isOpen?'▲':'▼'}</span>
      </div>
    </div>
    <div class="sub-body ${isOpen?'open':''}" id="subbody-${s.id}">
      ${s.notes?`<div class="sub-notes">"${esc(s.notes)}"</div>`:''}
      <div class="sub-date">Submitted ${fmtDate(s.created_at)}</div>
      <div class="code-block"><pre>${esc(s.code)}</pre></div>
      <div class="reviews-section">
        <div class="reviews-title">Peer Reviews</div>
        <div class="review-list" id="reviews-${s.id}"><div class="loading">Loading...</div></div>
        <div class="add-review">
          <div class="add-review-title">Leave a Review</div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Your Name</label>
              <input class="form-input" id="rv-name-${s.id}" type="text" placeholder="Your name"/>
            </div>
            <div class="form-group">
              <label class="form-label">Rating</label>
              <div class="star-picker" id="stars-${s.id}">
                ${[1,2,3,4,5].map(n=>`<button class="star-btn" data-val="${n}" onclick="setStar(${s.id},${n})">★</button>`).join('')}
              </div>
            </div>
            <div class="form-group full">
              <label class="form-label">Comment</label>
              <textarea class="form-textarea" id="rv-comment-${s.id}" placeholder="What did you think of this solution? Any suggestions?"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn-primary" onclick="submitReview(${s.id})">Submit Review</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

async function toggleSub(sid, qid){
  const body = document.getElementById(`subbody-${sid}`);
  const isOpen = expandedSubs.has(sid);
  if(isOpen){ expandedSubs.delete(sid); body.classList.remove('open'); }
  else { expandedSubs.add(sid); body.classList.add('open'); loadReviews(sid); }
}

// ── REVIEWS ────────────────────────────────────────────────
async function loadReviews(sid){
  const el = document.getElementById(`reviews-${sid}`); if(!el) return;
  try{
    const res = await fetch(`/api/reviews?submission_id=${sid}`);
    const reviews = await res.json();
    if(!reviews.length){ el.innerHTML='<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:10px">No reviews yet.</div>'; return; }
    el.innerHTML = reviews.map(r=>`
      <div class="review-item">
        <div class="review-top">
          <span class="reviewer-name">${esc(r.reviewer_name)}</span>
          <span class="review-stars">${renderStars(r.rating)}</span>
        </div>
        ${r.comment?`<div class="review-comment">${esc(r.comment)}</div>`:''}
        <div class="review-date">${fmtDate(r.created_at)}</div>
      </div>`).join('');
  } catch(e){ el.innerHTML='<div style="color:var(--hard);font-size:12px">Failed to load reviews.</div>'; }
}

function setStar(sid, val){
  reviewRatings[sid]=val;
  const btns = document.querySelectorAll(`#stars-${sid} .star-btn`);
  btns.forEach(b=>{ b.classList.toggle('active', parseInt(b.dataset.val)<=val); });
}

async function submitReview(sid){
  const name    = document.getElementById(`rv-name-${sid}`).value.trim();
  const comment = document.getElementById(`rv-comment-${sid}`).value.trim();
  const rating  = reviewRatings[sid]||0;
  if(!name||!rating){ showToast('Name and star rating are required','error'); return; }
  try{
    const res = await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({submission_id:sid,reviewer_name:name,rating,comment})});
    if(!res.ok) throw new Error();
    document.getElementById(`rv-name-${sid}`).value='';
    document.getElementById(`rv-comment-${sid}`).value='';
    reviewRatings[sid]=0;
    document.querySelectorAll(`#stars-${sid} .star-btn`).forEach(b=>b.classList.remove('active'));
    showToast('Review submitted! ⭐','success');
    loadReviews(sid);
  } catch(e){ showToast('Failed to submit review','error'); }
}

// ── LEADERBOARD ────────────────────────────────────────────
async function loadLeaderboard(){
  const el = document.getElementById('lbContent');
  el.innerHTML = '<div class="loading">Loading leaderboard...</div>';
  try{
    const res = await fetch('/api/leaderboard');
    const board = await res.json();
    if(!board.length){ el.innerHTML='<div class="empty-lb">No submissions yet. Be the first!</div>'; return; }
    const maxRating = Math.max(...board.map(c=>c.avg_rating),0.1);
    el.innerHTML = `
      <table class="lb-table">
        <thead><tr>
          <th>Rank</th><th>Name</th><th>Submissions</th><th>Avg Rating</th><th>Reviews Received</th><th>Rating Bar</th>
        </tr></thead>
        <tbody>
          ${board.map((c,i)=>`
          <tr>
            <td class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</td>
            <td class="lb-name">${esc(c.author_name)}</td>
            <td class="lb-subs">${c.submission_count}</td>
            <td class="lb-rating">${c.avg_rating>0?c.avg_rating.toFixed(2):'—'} ${renderStars(c.avg_rating)}</td>
            <td class="lb-reviews">${c.total_reviews}</td>
            <td class="lb-bar-cell">
              <div class="lb-bar-outer"><div class="lb-bar-inner" style="width:${(c.avg_rating/maxRating*100).toFixed(1)}%"></div></div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(e){ el.innerHTML='<div class="empty-lb">Failed to load leaderboard.</div>'; }
}

// ── COMPLETE ───────────────────────────────────────────────
function toggleComplete(id){
  completed.has(id)?completed.delete(id):completed.add(id);
  try{localStorage.setItem('hackathon_completed',JSON.stringify([...completed]));}catch(e){}
  if(completed.has(id)) showToast('Question marked complete! 🎉','success');
  renderSidebar(); updateProgress(); selectQuestion(id);
}

function updateProgress(){
  const total=questions.length, done=[...completed].filter(id=>questions.some(q=>q.id===id)).length;
  document.getElementById('progressCount').textContent=`${done} / ${total} completed`;
  document.getElementById('progressBar').style.width=(total?done/total*100:0)+'%';
  const counts={easy:0,medium:0,hard:0}, doneC={easy:0,medium:0,hard:0};
  questions.forEach(q=>{counts[q.difficulty]++;if(completed.has(q.id))doneC[q.difficulty]++;});
  const colors={easy:'var(--easy)',medium:'var(--medium)',hard:'var(--hard)'};
  document.getElementById('statsRow').innerHTML=Object.keys(counts).map(d=>`
    <div class="stat-pill">
      <div class="stat-dot" style="background:${colors[d]}"></div>
      <span style="color:${colors[d]};font-family:var(--font-mono);font-size:11px">${d}: ${doneC[d]}/${counts[d]}</span>
    </div>`).join('');
}

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); renderSidebar();
}

// ── DELETE QUESTION ────────────────────────────────────────
async function deleteQuestion(id){
  if(!confirm('Delete this question?')) return;
  try{
    await fetch('/api/questions/delete',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    activeId=null;
    document.getElementById('detailArea').innerHTML='<div class="empty-state"><div class="empty-state-icon">{ }</div><div class="empty-state-text">Question deleted.</div></div>';
    completed.delete(id); showToast('Question deleted','success'); await loadQuestions();
  } catch(e){ showToast('Failed to delete','error'); }
}

// ── ADD QUESTION ───────────────────────────────────────────
function toggleAddPanel(){
  const body=document.getElementById('panelBody'), toggle=document.getElementById('panelToggle');
  const open=body.classList.contains('open');
  body.classList.toggle('open',!open); toggle.classList.toggle('open',!open);
}

async function submitQuestion(){
  const title=document.getElementById('newTitle').value.trim();
  const desc=document.getElementById('newDesc').value.trim();
  const diff=document.getElementById('newDiff').value;
  const cat=document.getElementById('newCat').value.trim();
  const hintUrl=document.getElementById('newHintUrl').value.trim();
  const hintText=document.getElementById('newHintText').value.trim();
  if(!title||!desc){ showToast('Title and Description are required','error'); return; }
  try{
    const res=await fetch('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,description:desc,difficulty:diff,category:cat||'General',hint_url:hintUrl||'https://pkg.go.dev',hint_text:hintText||'Go documentation'})});
    if(!res.ok) throw new Error();
    ['newTitle','newDesc','newCat','newHintUrl','newHintText'].forEach(id=>document.getElementById(id).value='');
    toggleAddPanel(); showToast('Question added! ✓','success'); await loadQuestions();
  } catch(e){ showToast('Failed to add question','error'); }
}

// ── HELPERS ────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDesc(t){ return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br/>'); }
function fmtDate(d){ return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function renderStars(r){
  const full=Math.round(r), s=[];
  for(let i=1;i<=5;i++) s.push(i<=full?'★':'☆');
  return `<span style="color:var(--warn)">${s.join('')}</span>`;
}
function showToast(msg,type='success'){
  const t=document.getElementById('toast'); t.textContent=msg; t.className=`show ${type}`;
  setTimeout(()=>t.className='',3000);
}

// ── INIT ───────────────────────────────────────────────────
loadQuestions();
</script>
</body>
</html>
