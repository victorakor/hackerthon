<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Go Hackathon — 5hr Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:        #080c10;
    --surface:   #0d1520;
    --card:      #111b28;
    --border:    #1e3048;
    --accent:    #00d4ff;
    --accent2:   #00ff9d;
    --accent3:   #ff6b35;
    --warn:      #ffcc00;
    --text:      #c8daea;
    --muted:     #4a6b8a;
    --easy:      #00ff9d;
    --medium:    #ffcc00;
    --hard:      #ff4d6d;
    --font-mono: 'JetBrains Mono', monospace;
    --font-ui:   'Space Grotesk', sans-serif;
    --glow:      0 0 20px rgba(0,212,255,0.15);
    --glow-green:0 0 20px rgba(0,255,157,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--bg);
    letter-spacing: -1px;
    flex-shrink: 0;
  }

  .brand-name {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .brand-name span { color: var(--accent); }

  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--font-mono);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  /* ── TIMER ── */
  .timer-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .timer-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .timer-display {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--accent2);
    text-shadow: 0 0 20px rgba(0,255,157,0.4);
    transition: color 0.3s, text-shadow 0.3s;
  }

  .timer-display.warning { color: var(--warn); text-shadow: 0 0 20px rgba(255,204,0,0.4); }
  .timer-display.critical { color: var(--hard); text-shadow: 0 0 20px rgba(255,77,109,0.5); animation: pulse-timer 1s infinite; }

  @keyframes pulse-timer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .timer-controls {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }

  .timer-btn {
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .timer-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── PROGRESS BAR ── */
  .progress-section {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .progress-count {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
  }

  .progress-bar-outer {
    height: 6px;
    background: var(--surface);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px rgba(0,212,255,0.4);
  }

  .stats-row {
    display: flex;
    gap: 20px;
    margin-top: 10px;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── MAIN LAYOUT ── */
  .main-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 24px;
    padding: 24px 0;
    min-height: calc(100vh - 200px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .sidebar-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-chip:hover, .filter-chip.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.05);
  }

  .question-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    max-height: calc(100vh - 320px);
    padding-right: 4px;
  }

  .question-list::-webkit-scrollbar { width: 4px; }
  .question-list::-webkit-scrollbar-track { background: transparent; }
  .question-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .q-item {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .q-item:hover { border-color: var(--accent); background: rgba(0,212,255,0.04); }
  .q-item.active { border-color: var(--accent); background: rgba(0,212,255,0.08); box-shadow: var(--glow); }
  .q-item.completed { opacity: 0.5; }
  .q-item.completed .q-num { background: var(--accent2); color: var(--bg); }

  .q-num {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--bg);
    background: var(--muted);
    border-radius: 4px;
    padding: 2px 5px;
    flex-shrink: 0;
    min-width: 24px;
    text-align: center;
    transition: background 0.2s;
  }

  .q-item.active .q-num { background: var(--accent); }

  .q-info { flex: 1; min-width: 0; }

  .q-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .q-meta {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    align-items: center;
  }

  .diff-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .diff-easy   { background: rgba(0,255,157,0.1); color: var(--easy); }
  .diff-medium { background: rgba(255,204,0,0.1);  color: var(--medium); }
  .diff-hard   { background: rgba(255,77,109,0.1); color: var(--hard); }

  .cat-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── QUESTION DETAIL ── */
  .detail-pane {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 400px;
    gap: 16px;
    opacity: 0.4;
  }

  .empty-state-icon {
    font-size: 48px;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .empty-state-text {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }

  .detail-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: slide-in 0.3s ease;
  }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .detail-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .detail-title-group { flex: 1; }

  .detail-number {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .detail-title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.5px;
  }

  .detail-badges {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .badge-easy   { border-color: var(--easy);   color: var(--easy); }
  .badge-medium { border-color: var(--medium); color: var(--medium); }
  .badge-hard   { border-color: var(--hard);   color: var(--hard); }
  .badge-cat    { border-color: var(--border); color: var(--muted); }

  .detail-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-complete {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(0,255,157,0.05);
  }
  .btn-complete:hover { background: rgba(0,255,157,0.15); box-shadow: var(--glow-green); }
  .btn-complete.done { background: rgba(0,255,157,0.2); }

  .btn-delete {
    border-color: var(--border);
    color: var(--muted);
    background: transparent;
  }
  .btn-delete:hover { border-color: var(--hard); color: var(--hard); }

  .detail-body {
    padding: 28px;
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .description-text {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
  }

  .description-text code {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--accent);
  }

  .hint-card {
    margin-top: 24px;
    padding: 16px 20px;
    background: rgba(0,212,255,0.04);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .hint-icon {
    font-size: 18px;
    flex-shrink: 0;
  }

  .hint-content { flex: 1; }

  .hint-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .hint-link {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    transition: color 0.2s;
  }

  .hint-link:hover {
    color: var(--accent2);
    text-decoration: underline;
  }

  /* ── ADD QUESTION PANEL ── */
  .add-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .panel-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  .panel-header:hover { background: rgba(0,212,255,0.03); }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-toggle {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--muted);
    transition: transform 0.3s;
  }

  .panel-toggle.open { transform: rotate(45deg); }

  .panel-body {
    padding: 24px;
    display: none;
  }
  .panel-body.open { display: block; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full { grid-column: 1 / -1; }

  .form-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .form-input, .form-select, .form-textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    width: 100%;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  .form-select option { background: var(--surface); }

  .form-textarea {
    resize: vertical;
    min-height: 100px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
  }

  .form-actions {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .btn-submit {
    padding: 10px 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 8px;
    color: var(--bg);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,212,255,0.3); }
  .btn-submit:active { transform: translateY(0); }

  .btn-cancel {
    padding: 10px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    border: 1px solid;
    pointer-events: none;
  }

  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { background: rgba(0,255,157,0.1); border-color: var(--accent2); color: var(--accent2); }
  #toast.error   { background: rgba(255,77,109,0.1); border-color: var(--hard); color: var(--hard); }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
    .question-list { max-height: 240px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-logo">Go</div>
      <div>
        <div class="brand-name">hack<span>.go</span></div>
        <div class="brand-sub">Bootcamp Challenge</div>
      </div>
    </div>

    <div class="timer-block">
      <div class="timer-label">⏱ Time Remaining</div>
      <div class="timer-display" id="timerDisplay">05:00:00</div>
      <div class="timer-controls">
        <button class="timer-btn" id="timerToggle" onclick="toggleTimer()">PAUSE</button>
        <button class="timer-btn" onclick="resetTimer()">RESET</button>
      </div>
    </div>
  </header>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="progress-meta">
      <div class="progress-label">Challenge Progress</div>
      <div class="progress-count" id="progressCount">0 / 0 completed</div>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
    </div>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <!-- MAIN -->
  <div class="main-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Questions</div>
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="filter-chip" data-filter="easy" onclick="setFilter('easy',this)">Easy</button>
        <button class="filter-chip" data-filter="medium" onclick="setFilter('medium',this)">Medium</button>
        <button class="filter-chip" data-filter="hard" onclick="setFilter('hard',this)">Hard</button>
      </div>
      <div class="question-list" id="questionList"></div>
    </aside>

    <!-- DETAIL + ADD -->
    <div class="detail-pane">
      <div id="detailArea">
        <div class="empty-state">
          <div class="empty-state-icon">{ }</div>
          <div class="empty-state-text">← Select a question to begin<br/>Your 5-hour clock is ticking</div>
        </div>
      </div>

      <!-- ADD QUESTION PANEL -->
      <div class="add-panel">
        <div class="panel-header" onclick="toggleAddPanel()">
          <div class="panel-title">
            <span>+</span>
            Add New Question
          </div>
          <div class="panel-toggle" id="panelToggle">+</div>
        </div>
        <div class="panel-body" id="panelBody">
          <div class="form-grid">
            <div class="form-group full">
              <label class="form-label">Question Title</label>
              <input class="form-input" id="newTitle" type="text" placeholder="e.g. Reading files with bufio.Scanner"/>
            </div>
            <div class="form-group full">
              <label class="form-label">Description / Task</label>
              <textarea class="form-textarea" id="newDesc" placeholder="Describe what the candidate needs to implement..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Difficulty</label>
              <select class="form-select" id="newDiff">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Category</label>
              <input class="form-input" id="newCat" type="text" placeholder="e.g. File I/O, String Manipulation"/>
            </div>
            <div class="form-group">
              <label class="form-label">Hint Link URL</label>
              <input class="form-input" id="newHintUrl" type="url" placeholder="https://pkg.go.dev/..."/>
            </div>
            <div class="form-group">
              <label class="form-label">Hint Link Text</label>
              <input class="form-input" id="newHintText" type="text" placeholder="e.g. os.ReadFile docs"/>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn-cancel" onclick="toggleAddPanel()">Cancel</button>
            <button class="btn-submit" onclick="submitQuestion()">+ Add Question</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  // ── STATE ──
  let questions = [];
  let completed = new Set();
  let activeId = null;
  let currentFilter = 'all';

  // Load completed from localStorage
  try {
    const saved = localStorage.getItem('hackathon_completed');
    if (saved) completed = new Set(JSON.parse(saved));
  } catch(e) {}

  // ── TIMER ──
  const DURATION = 5 * 60 * 60; // 5 hours in seconds
  let timeLeft = DURATION;
  let timerRunning = true;
  let timerInterval;

  try {
    const savedTimer = localStorage.getItem('hackathon_timer');
    if (savedTimer) {
      const t = parseInt(savedTimer);
      if (t > 0 && t <= DURATION) timeLeft = t;
    }
  } catch(e) {}

  function formatTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    el.textContent = formatTime(timeLeft);
    el.className = 'timer-display';
    if (timeLeft <= 600) el.classList.add('critical');
    else if (timeLeft <= 1800) el.classList.add('warning');
  }

  function tickTimer() {
    if (!timerRunning) return;
    if (timeLeft > 0) {
      timeLeft--;
      updateTimerDisplay();
      try { localStorage.setItem('hackathon_timer', timeLeft); } catch(e) {}
    } else {
      clearInterval(timerInterval);
      showToast("⏰ Time's up!", 'error');
    }
  }

  function toggleTimer() {
    timerRunning = !timerRunning;
    document.getElementById('timerToggle').textContent = timerRunning ? 'PAUSE' : 'START';
  }

  function resetTimer() {
    timeLeft = DURATION;
    timerRunning = true;
    document.getElementById('timerToggle').textContent = 'PAUSE';
    updateTimerDisplay();
    try { localStorage.removeItem('hackathon_timer'); } catch(e) {}
  }

  timerInterval = setInterval(tickTimer, 1000);
  updateTimerDisplay();

  // ── FETCH QUESTIONS ──
  async function loadQuestions() {
    try {
      const res = await fetch('/api/questions');
      if (!res.ok) throw new Error('Failed to load');
      questions = await res.json();
      renderSidebar();
      updateProgress();
    } catch(e) {
      showToast('Failed to load questions', 'error');
    }
  }

  // ── RENDER ──
  function renderSidebar() {
    const list = document.getElementById('questionList');
    const filtered = currentFilter === 'all'
      ? questions
      : questions.filter(q => q.difficulty === currentFilter);

    list.innerHTML = filtered.map(q => `
      <div class="q-item ${activeId === q.id ? 'active' : ''} ${completed.has(q.id) ? 'completed' : ''}"
           onclick="selectQuestion(${q.id})">
        <div class="q-num">${completed.has(q.id) ? '✓' : q.id}</div>
        <div class="q-info">
          <div class="q-title">${escHtml(q.title)}</div>
          <div class="q-meta">
            <span class="diff-badge diff-${q.difficulty}">${q.difficulty}</span>
            <span class="cat-tag">${escHtml(q.category)}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function selectQuestion(id) {
    activeId = id;
    renderSidebar();
    const q = questions.find(q => q.id === id);
    if (!q) return;

    const isDone = completed.has(id);

    document.getElementById('detailArea').innerHTML = `
      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-title-group">
            <div class="detail-number">Question #${q.id}</div>
            <div class="detail-title">${escHtml(q.title)}</div>
            <div class="detail-badges">
              <span class="badge badge-${q.difficulty}">${q.difficulty}</span>
              <span class="badge badge-cat">${escHtml(q.category)}</span>
            </div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-complete ${isDone ? 'done' : ''}"
                    onclick="toggleComplete(${q.id})"
                    id="completeBtn-${q.id}">
              ${isDone ? '✓ Completed' : '◎ Mark Done'}
            </button>
            <button class="btn btn-delete" onclick="deleteQuestion(${q.id})">✕</button>
          </div>
        </div>
        <div class="detail-body">
          <div class="section-label">Task Description</div>
          <div class="description-text">${formatDesc(q.description)}</div>
          <div class="hint-card">
            <div class="hint-icon">💡</div>
            <div class="hint-content">
              <div class="hint-label">Hint — Go Docs</div>
              <a class="hint-link" href="${escHtml(q.hint_url)}" target="_blank" rel="noopener">
                → ${escHtml(q.hint_text || q.hint_url)}
              </a>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function formatDesc(text) {
    return escHtml(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br/>');
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // ── COMPLETE ──
  function toggleComplete(id) {
    if (completed.has(id)) {
      completed.delete(id);
    } else {
      completed.add(id);
      showToast('Question marked complete! 🎉', 'success');
    }
    try { localStorage.setItem('hackathon_completed', JSON.stringify([...completed])); } catch(e) {}
    renderSidebar();
    updateProgress();
    selectQuestion(id);
  }

  // ── PROGRESS ──
  function updateProgress() {
    const total = questions.length;
    const done = [...completed].filter(id => questions.some(q => q.id === id)).length;
    const pct = total > 0 ? (done / total * 100) : 0;

    document.getElementById('progressCount').textContent = `${done} / ${total} completed`;
    document.getElementById('progressBar').style.width = pct + '%';

    const counts = { easy: 0, medium: 0, hard: 0 };
    const doneC  = { easy: 0, medium: 0, hard: 0 };
    questions.forEach(q => {
      counts[q.difficulty]++;
      if (completed.has(q.id)) doneC[q.difficulty]++;
    });

    const colors = { easy: 'var(--easy)', medium: 'var(--medium)', hard: 'var(--hard)' };
    document.getElementById('statsRow').innerHTML = Object.keys(counts).map(d => `
      <div class="stat-pill">
        <div class="stat-dot" style="background:${colors[d]}"></div>
        <span style="color:${colors[d]};font-family:var(--font-mono);font-size:11px">
          ${d}: ${doneC[d]}/${counts[d]}
        </span>
      </div>
    `).join('');
  }

  // ── FILTER ──
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    renderSidebar();
  }

  // ── DELETE ──
  async function deleteQuestion(id) {
    if (!confirm('Delete this question?')) return;
    try {
      const res = await fetch('/api/questions/delete', {
        method: 'DELETE',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({id})
      });
      if (!res.ok) throw new Error('Delete failed');
      if (activeId === id) {
        activeId = null;
        document.getElementById('detailArea').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">{ }</div>
            <div class="empty-state-text">Question deleted.</div>
          </div>`;
      }
      completed.delete(id);
      showToast('Question deleted', 'success');
      await loadQuestions();
    } catch(e) {
      showToast('Failed to delete question', 'error');
    }
  }

  // ── ADD PANEL ──
  function toggleAddPanel() {
    const body = document.getElementById('panelBody');
    const toggle = document.getElementById('panelToggle');
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    toggle.classList.toggle('open', !isOpen);
  }

  async function submitQuestion() {
    const title    = document.getElementById('newTitle').value.trim();
    const desc     = document.getElementById('newDesc').value.trim();
    const diff     = document.getElementById('newDiff').value;
    const cat      = document.getElementById('newCat').value.trim();
    const hintUrl  = document.getElementById('newHintUrl').value.trim();
    const hintText = document.getElementById('newHintText').value.trim();

    if (!title || !desc) {
      showToast('Title and Description are required', 'error');
      return;
    }

    const q = {
      title,
      description: desc,
      difficulty: diff,
      category: cat || 'General',
      hint_url: hintUrl || 'https://pkg.go.dev',
      hint_text: hintText || 'Go documentation'
    };

    try {
      const res = await fetch('/api/questions', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(q)
      });
      if (!res.ok) throw new Error('Add failed');
      // Clear form
      ['newTitle','newDesc','newCat','newHintUrl','newHintText'].forEach(id => {
        document.getElementById(id).value = '';
      });
      toggleAddPanel();
      showToast('Question added! ✓', 'success');
      await loadQuestions();
    } catch(e) {
      showToast('Failed to add question', 'error');
    }
  }

  // ── TOAST ──
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    setTimeout(() => { t.className = ''; }, 3000);
  }

  // ── INIT ──
  loadQuestions();
</script>
</body>
</html>
